name: CTEC V66 QA giao dien nguoi hoc
on:
  push:
    branches: [gh-pages]
    paths:
      - 'ctec-ai-training/v66/index.html'
      - 'ctec-ai-training/v66/test_ui.js'
      - '.github/workflows/ctec-v66-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Cai Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cai Chromium Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Chay 35 tram, 3 bai, 2 vai, 5 kich thuoc
        continue-on-error: true
        run: |
          node ctec-ai-training/v66/test_ui.js
      - name: Ghi bang chung, khong tu nang CLASS_PASS
        if: always()
        run: |
          git config user.name "ctec-ui-qa-bot"
          git config user.email "ctec-ui-qa-bot@users.noreply.github.com"
          git add ctec-ai-training/v66/qa_result.json ctec-ai-training/v66/qa_*.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "CTEC V6.6: Chromium UI QA results; simulation only"
            git push origin gh-pages
          fi
